                    - strong [ref=f1e213]: Heap
                  - cell "Where rows physically live, in 8KB pages" [ref=f1e214]
                - row [ref=f1e215]:
                  - cell [ref=f1e216]:
                    - strong [ref=f1e217]: Buffer pool
                  - cell "Cache hot pages in RAM, skip the disk" [ref=f1e218]
                - row [ref=f1e219]:
                  - cell [ref=f1e220]:
                    - strong [ref=f1e221]: Disk I/O
                  - cell "Read and write real 8KB pages in the file" [ref=f1e222]
                - row [ref=f1e223]:
                  - cell [ref=f1e224]:
                    - strong [ref=f1e225]: Transactions / MVCC
                  - cell "All-or-nothing changes and safe concurrency" [ref=f1e226]
                - row [ref=f1e227]:
                  - cell [ref=f1e228]:
                    - strong [ref=f1e229]: WAL
                  - cell "Log before data, so “committed” survives a crash" [ref=f1e230]
                - row [ref=f1e231]:
                  - cell [ref=f1e232]:
                    - strong [ref=f1e233]: Replication
                  - cell "Ship the WAL to copies for safety and scale" [ref=f1e234]
            - heading "The takeaway" [level=2] [ref=f1e235]
            - paragraph [ref=f1e236]: A query comes in the top, falls through the brain and into storage to fetch some bytes, and three safety layers wrap the whole thing so it stays correct, durable, and available. That’s it. That’s the database.
            - paragraph [ref=f1e237]:
              - text: "None of these layers is magic. Each one is a sensible answer to a specific, concrete problem:"
              - emphasis [ref=f1e238]: how does the query get in? how do we understand it? how do we avoid scanning everything? how do we not touch the slow disk? how do we survive a crash?
              - text: Once you can name the problem, the layer that solves it stops being mysterious.
            - paragraph [ref=f1e239]: So carry the map. The next time a query is slow, or a “committed” write goes missing, or two transactions step on each other, you’ll know exactly which of these twelve rooms to go looking in.
